<script>
(function(){
'use strict';
/* ================= iCOOPs R1 demo — core engine ================= */
var KEY = 'icoops-demo-v1';
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function r2(x){ var s = x < 0 ? -1 : 1; return s * Math.round(Math.abs(x) * 100 + 1e-7) / 100; }
function sum(a, f){ return r2(a.reduce(function(t, x){ return t + (f ? f(x) : x); }, 0)); }
function peso(x){ x = r2(+x || 0); var s = Math.abs(x).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2}); return (x < 0 ? '−₱' : '₱') + s; }
function pesoK(x){ x = +x || 0; if (Math.abs(x) >= 1e6) return '₱' + (x/1e6).toFixed(2) + 'M'; if (Math.abs(x) >= 1e3) return '₱' + (x/1e3).toFixed(1) + 'K'; return peso(x); }
function n0(x){ return (+x || 0).toLocaleString('en-PH'); }
function pct(x, d){ return ((+x || 0) * 100).toFixed(d == null ? 1 : d) + '%'; }
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function D2(s){ var p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1]-1, p[2])); }
function iso(d){ return d.toISOString().slice(0,10); }
function addDays(s, n){ var t = D2(s); t.setUTCDate(t.getUTCDate() + n); return iso(t); }
function addMonths(s, n, day){ var p = s.split('-').map(Number); var mm = p[1]-1+n; var yy = p[0] + Math.floor(mm/12); mm = ((mm%12)+12)%12; var last = new Date(Date.UTC(yy, mm+1, 0)).getUTCDate(); return iso(new Date(Date.UTC(yy, mm, Math.min(day || p[2], last)))); }
function days(a, b){ return Math.round((D2(b) - D2(a)) / 864e5); }
function per(s){ return s.slice(0,7); }
function perAdd(p, n){ return addMonths(p + '-01', n, 1).slice(0,7); }
function fdate(s){ if (!s) return '—'; var p = s.split('-'); return MON[+p[1]-1] + ' ' + (+p[2]) + ', ' + p[0]; }
function fper(p){ return MON[+p.slice(5,7)-1] + ' ' + p.slice(0,4); }
function dow(s){ return D2(s).getUTCDay(); }
function monthsBetween(a, b){ var x = a.split('-').map(Number), y = b.split('-').map(Number); return (y[0]-x[0])*12 + (y[1]-x[1]) - (y[2] < x[2] ? 1 : 0); }
function clock(){ var d = new Date(); return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2); }
function rng(seed){ var a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- Chart of accounts (CDA-style, illustrative) ---------- */

  ['1-10100','Cash on hand','A'],['1-10200','Cash in bank','A'],['1-12100','Loans receivable','A'],['1-12900','Allowance for probable losses','A'],
  ['1-13110','Payroll receivable — office 1','A'],['1-13120','Payroll receivable — office 2','A'],['1-13130','Payroll receivable — office 3','A'],
  ['1-13500','Accounts receivable — members','A'],
  ['2-21100','Savings deposits payable','L'],['2-22100','Clearing — deductions in transit','L'],['2-23100','Insurance payable','L'],
  ['2-23200','Withholding tax payable','L'],['2-23300','DST payable','L'],['2-24100','Damayan (mutual aid) fund','L'],['2-25100','Deposits from applicants','L'],['2-29000','Suspense','L'],
  ['3-31100','Paid-up share capital','E'],['3-32000','Statutory reserve fund','E'],['3-34000','Undivided net surplus','E'],
  ['4-41100','Interest income — loans','I'],['4-41200','Service fee income','I'],['4-41300','Penalty income','I'],['4-42100','Membership fee income','I'],
  ['5-51100','Interest expense on deposits','X'],['5-52100','Payroll service fee expense','X'],['5-53100','Provision for probable losses','X'],['5-59000','Operating expenses','X']
];
var COAMAP = {}; COA.forEach(function(c){ COAMAP[c[0]] = {code:c[0], name:c[1], type:c[2]}; });

var ROLES = {teller:'Teller', memoff:'Membership officer', loanoff:'Loan officer', coll:'Collections officer', book:'Bookkeeper', acct:'Accountant', gm:'General Manager', board:'Board / Credit Committee', auditor:'Auditor', admin:'Tenant admin'};
/* FS security matrix: C create · A approve · V view */
var PERM = {
  member:{teller:'V',memoff:'C',loanoff:'V',coll:'V',book:'V',acct:'V',gm:'A',board:'V',auditor:'V'},

var PERM_LABEL = {member:'Member record',memapprove:'Membership approval',posting:'Deposit / payment posting',wdlimit:'Withdrawal above limit',loaneval:'Loan application and evaluation',loanapprove:'Loan approval',voucher:'Loan release voucher',eod:'Teller EOD',batch:'Deduction batch and matching',jv:'Journal voucher',close:'Period close / reopen',config:'Product and rule configuration',users:'Users and roles',audit:'Audit log'};

/* ---------- state ---------- */
var S = null;
function T(){ return S.tenants[S.t]; }
function me(){ var D = T(); return D.users.filter(function(u){ return u.id === S.as[S.t]; })[0] || D.users[0]; }
function userBy(id){ var D = T(); return D.users.filter(function(u){ return u.id === id; })[0]; }
function uname(id){ var u = userBy(id); return u ? u.name : (id || '—'); }
function userFor(role){ var D = T(); return D.users.filter(function(u){ return u.role === role; })[0]; }
function isRole(roles){ return roles.indexOf(me().role) >= 0; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function load(){ try { var s = localStorage.getItem(KEY); if (s){ var o = JSON.parse(s); if (o && o.v === 3) return o; } } catch(e){} return null; }

function mem(id){ return T().members.filter(function(m){ return m.id === id; })[0]; }
function mname(m, short){ if (typeof m === 'string') m = mem(m); if (!m) return '—'; return short ? m.first + ' ' + m.last : m.last + ', ' + m.first + (m.mi ? ' ' + m.mi + '.' : ''); }
function acct(mid, prod){ return T().accts.filter(function(a){ return a.mid === mid && a.prod === prod; })[0]; }
function office(code){ return T().offices.filter(function(o){ return o.code === code; })[0]; }
function loanBy(id){ return T().loans.filter(function(l){ return l.id === id; })[0]; }
function prodBy(id){ return T().products.filter(function(p){ return p.id === id; })[0]; }

function log(D, action, entity, id, detail, uid){
  D.audit.unshift({at: D.biz + ' ' + clock(), user: uid || (S && S.as ? S.as[D.id] : 'system'), action: action, entity: entity, ref: id, detail: detail || ''});
  if (D.audit.length > 400) D.audit.length = 400;
}
function pass(D, at, note){ if (!D.at[at]){ D.at[at] = {on: D.biz + ' ' + clock(), note: note || ''}; if (S && S.t === D.id) toast(at + ' passed — ' + (note || 'acceptance scenario met')); } }

/* ---------- rules ---------- */
function ruleFor(D, prod, date){
  var vs = D.rules.filter(function(r){ return r.prod === prod && r.status === 'Active' && r.eff <= date; });
  vs.sort(function(a, b){ return a.eff < b.eff ? 1 : -1; });
  return vs[0];
}
function amortize(P, rate, n, method, release){
  var i = rate / 12, rows = [], k, A;
  if (method === 'Diminishing'){
    A = r2(P * i / (1 - Math.pow(1 + i, -n)));
    var bal = P;
    for (k = 1; k <= n; k++){
      var it = r2(bal * i), pr = r2(A - it);
      if (k === n) pr = r2(bal);
      bal = r2(bal - pr);
      rows.push({k:k, due: release ? addMonths(release, k, 25) : '', int: it, prin: pr, amt: r2(it + pr), bal: bal, pi: 0, pp: 0});
    }
  } else {
    var I = r2(P * rate * n / 12), ip = r2(I / n), pp = r2(P / n), bl = P, ti = 0, tp = 0;
    for (k = 1; k <= n; k++){
      var a1 = k === n ? r2(I - ti) : ip, b1 = k === n ? r2(P - tp) : pp;
      ti = r2(ti + a1); tp = r2(tp + b1); bl = r2(bl - b1);
      rows.push({k:k, due: release ? addMonths(release, k, 25) : '', int: a1, prin: b1, amt: r2(a1 + b1), bal: bl, pi: 0, pp: 0});
    }
    A = rows[0].amt;
  }
  return {A: A, rows: rows, totalInt: sum(rows, function(r){ return r.int; })};
}
function releaseCalc(D, prodId, P, n, date, priorLoanId){
  var rv = ruleFor(D, prodId, date), p = rv.params;
  var am = amortize(P, p.rate, n, p.method, date);
  var prior = priorLoanId ? D.loans.filter(function(q){ return q.id === priorLoanId; })[0] : null;
  var payoff = prior ? payoffAmt(prior, date) : 0;
  var d = {
    fee: r2(P * p.fee), ins: r2(P * p.ins * n), dst: p.dstExempt ? 0 : r2(Math.ceil(P / 200) * 1.5),
    cbu: r2(P * p.cbuRet), payoff: payoff, adv: p.method === 'Discounted' ? am.totalInt : 0
  };
  var ded = r2(d.fee + d.ins + d.dst + d.cbu + d.payoff + d.adv);
  return {rule: rv, A: am.A, rows: am.rows, totalInt: am.totalInt, d: d, ded: ded, net: r2(P - ded)};
}

/* ---------- loans ---------- */
function loanBal(l){ return r2(l.P - sum(l.sched, function(r){ return r.pp; })); }
function payoffAmt(l, date){ return r2(loanBal(l) + sum(l.sched.filter(function(r){ return r.due <= date; }), function(r){ return r2(r.int - r.pi); }) + penaltyDue(l, date)); }
function rowUnpaid(r){ return r2(r.int - r.pi + r.prin - r.pp); }
function overdueRows(l, date){ var g = (l.grace == null ? 7 : l.grace); return l.sched.filter(function(r){ return rowUnpaid(r) > 0 && days(r.due, date) > g; }); }
function pastDueAmt(l, date){ return sum(overdueRows(l, date), rowUnpaid); }
function daysPastDue(l, date){ var o = overdueRows(l, date); return o.length ? days(o[0].due, date) : 0; }
function penaltyDue(l, date){
  var g = (l.grace == null ? 7 : l.grace), t = 0;
  overdueRows(l, date).forEach(function(r){ var late = days(r.due, date) - g; var u = rowUnpaid(r); t += Math.min(u * 0.02 * late / 30, u * 0.25); });
  return Math.max(0, r2(t - (l.penPaid || 0)));
}
function dueThrough(l, date){ return sum(l.sched.filter(function(r){ return r.due <= date && rowUnpaid(r) > 0; }), rowUnpaid); }
function dueThisMonth(l, date){ var end = addMonths(date.slice(0,8) + '01', 1, 1); return sum(l.sched.filter(function(r){ return r.due < end && rowUnpaid(r) > 0; }), rowUnpaid); }
function applyLoan(l, amt, date, withPenalty, payoff){
  var a = {pen: 0, rows: [], over: 0}; amt = r2(amt);
  if (withPenalty){ var pd = penaltyDue(l, date); a.pen = Math.min(pd, amt); amt = r2(amt - a.pen); l.penPaid = r2((l.penPaid || 0) + a.pen); }
  if (payoff){
    l.sched.forEach(function(r){ if (amt <= 0 || r.due > date) return; var ni = r2(r.int - r.pi); if (ni > 0){ var ti = Math.min(ni, amt); amt = r2(amt - ti); r.pi = r2(r.pi + ti); a.rows.push({k: r.k, i: ti, p: 0}); } });
    l.sched.forEach(function(r){ if (amt <= 0) return; var np = r2(r.prin - r.pp); if (np > 0){ var tp = Math.min(np, amt); amt = r2(amt - tp); r.pp = r2(r.pp + tp); a.rows.push({k: r.k, i: 0, p: tp}); } });
    a.over = amt; return a;
  }
  for (var j = 0; j < l.sched.length && amt > 0; j++){
    var r = l.sched[j], ni = r2(r.int - r.pi), np = r2(r.prin - r.pp), ti = 0, tp = 0;
    if (ni > 0){ ti = Math.min(ni, amt); amt = r2(amt - ti); r.pi = r2(r.pi + ti); }
    if (np > 0 && amt > 0){ tp = Math.min(np, amt); amt = r2(amt - tp); r.pp = r2(r.pp + tp); }
    if (ti || tp) a.rows.push({k: r.k, i: ti, p: tp});

}
function unapplyLoan(l, a, date){
  l.penPaid = r2((l.penPaid || 0) - a.pen);
  a.rows.forEach(function(x){ var r = l.sched[x.k - 1]; r.pi = r2(r.pi - x.i); r.pp = r2(r.pp - x.p); });
  if (l.status === 'Paid' || l.status === 'Renewed') l.status = 'Active';

}
function allocTotals(a){ return {pen: a.pen, int: sum(a.rows, function(x){ return x.i; }), prin: sum(a.rows, function(x){ return x.p; })}; }
function setLoanStatus(l, date){
  if (['Renewed','Written off'].indexOf(l.status) >= 0) return;
  if (loanBal(l) <= 0 && sum(l.sched, function(r){ return r2(r.int - r.pi); }) <= 0){ l.status = 'Paid'; return; }
  l.status = overdueRows(l, date).length ? 'Past due' : 'Active';
}
function openLoans(D, mid){ return D.loans.filter(function(l){ return (!mid || l.mid === mid) && (l.status === 'Active' || l.status === 'Past due'); }); }

/* ---------- posting (every money movement = txn + balanced JE) ---------- */
function book(D, t){
  var dr = sum(t.gl, function(g){ return g[1] || 0; }), cr = sum(t.gl, function(g){ return g[2] || 0; });
  if (Math.abs(dr - cr) > 0.004) throw new Error('Unbalanced entry ' + dr + ' vs ' + cr + ' (' + t.type + ')');
  D.seq.t++; D.seq.je++;
  var tid = 'T-' + pad(D.seq.t, 6), jid = 'JE-' + pad(D.seq.je, 5);
  var lines = t.gl.filter(function(g){ return r2((g[1] || 0)) !== 0 || r2((g[2] || 0)) !== 0; }).map(function(g){ return {a: g[0], dr: r2(g[1] || 0), cr: r2(g[2] || 0)}; });
  var tx = {id: tid, date: t.date, type: t.type, channel: t.channel || '', mid: t.mid || null, total: t.total != null ? r2(t.total) : dr, lines: t.lines || [], je: jid, by: t.by, or: t.or || null, memo: t.memo || '', status: 'Posted', reversedBy: null, sess: t.sess || null, ref: t.ref || null};
  D.txns.push(tx);
  D.je.push({id: jid, date: t.date, src: tid, type: t.type, memo: t.memo || t.type, lines: lines, by: t.by});
  return tx;
}
function glBal(D, code, upto){
  var t = 0; D.je.forEach(function(j){ if (upto && j.date > upto) return; j.lines.forEach(function(l){ if (l.a === code) t += l.dr - l.cr; }); });
  var ty = COAMAP[code].type; return r2((ty === 'A' || ty === 'X') ? t : -t);
}
function moveAcct(a, date, amt, tid){ a.bal = r2(a.bal + amt); a.mov.push({d: date, amt: r2(amt), t: tid}); }

function postReceipt(D, o){
  var gl = [], lines = [], total = 0, savOver = 0;
  function acct(mid, prod){ return D.accts.filter(function(a){ return a.mid === mid && a.prod === prod; })[0]; }
  o.lines.forEach(function(x){
    var amt = r2(x.amt); if (amt <= 0) return; total = r2(total + amt);
    if (x.kind === 'loan'){
      var l = D.loans.filter(function(q){ return q.id === x.ref; })[0];
      var a = applyLoan(l, amt, o.date, true), at = allocTotals(a);
      gl.push(['4-41300', 0, at.pen], ['4-41100', 0, at.int], ['1-12100', 0, at.prin]);
      savOver = r2(savOver + a.over);
      lines.push({kind: 'loan', ref: l.id, amt: amt, alloc: a});
    } else {
      var ac = x.kind === 'cbu' ? acct(o.mid, 'CBU') : acct(o.mid, 'SAV');
      gl.push([x.kind === 'cbu' ? '3-31100' : '2-21100', 0, amt]);
      lines.push({kind: x.kind, ref: ac.id, amt: amt});
    }
  });
  if (savOver > 0){ gl.push(['2-21100', 0, savOver]); lines.push({kind: 'sav', ref: acct(o.mid, 'SAV').id, amt: savOver, over: true}); }
  if (total <= 0) return null;
  gl.unshift([o.cashAcct || '1-10100', total, 0]);
  D.seq.or++;
  var orNo = 'OR ' + pad(D.seq.or, 7);
  var tx = book(D, {date: o.date, type: 'Member payment', channel: o.channel || 'Cash', mid: o.mid, lines: lines, gl: gl, by: o.by, or: orNo, memo: 'Payment — ' + (function(){ var m = D.members.filter(function(q){ return q.id === o.mid; })[0]; return m.first + ' ' + m.last; })(), sess: o.sess});
  lines.forEach(function(x){ if (x.kind !== 'loan'){ var ac = D.accts.filter(function(q){ return q.id === x.ref; })[0]; moveAcct(ac, o.date, x.amt, tx.id); } });
  return tx;
}
function postWithdrawal(D, o){
  var ac = D.accts.filter(function(q){ return q.mid === o.mid && q.prod === 'SAV'; })[0];
  var tx = book(D, {date: o.date, type: 'Savings withdrawal', channel: 'Cash', mid: o.mid, lines: [{kind: 'sav', ref: ac.id, amt: -o.amt}], gl: [['2-21100', o.amt, 0], ['1-10100', 0, o.amt]], by: o.by, memo: 'Withdrawal — ' + ac.no, sess: o.sess});
  moveAcct(ac, o.date, -o.amt, tx.id);
  return tx;
}
function reverseTxn(D, tx, reason, by, override){
  var j = D.je.filter(function(x){ return x.id === tx.je; })[0];
  var gl = j.lines.map(function(l){ return [l.a, l.cr, l.dr]; });
  tx.lines.forEach(function(x){
    if (x.kind === 'loan'){ unapplyLoan(D.loans.filter(function(q){ return q.id === x.ref; })[0], x.alloc, D.biz); }
    else { var ac = D.accts.filter(function(q){ return q.id === x.ref; })[0]; moveAcct(ac, D.biz, -x.amt, 'rev'); }
  });
  var rv = book(D, {date: D.biz, type: 'Reversal', channel: tx.channel, mid: tx.mid, lines: [], gl: gl, by: by, memo: 'Reversal of ' + (tx.or || tx.id) + ' — ' + reason + (override ? ' [manager override after day lock]' : ''), ref: tx.id, total: tx.total});
  tx.status = 'Reversed'; tx.reversedBy = rv.id;
  return rv;
}
function doRelease(D, l, date, by, channel){
  var c = releaseCalc(D, l.prod, l.P, l.n, date, l.renew);
  var cashAcct = channel === 'Cash' ? '1-10100' : '1-10200';
  var gl = [['1-12100', l.P, 0], [cashAcct, 0, c.net], ['4-41200', 0, c.d.fee], ['2-23100', 0, c.d.ins], ['2-23300', 0, c.d.dst], ['3-31100', 0, c.d.cbu]];
  var lines = [];
  if (l.renew){
    var prior = D.loans.filter(function(q){ return q.id === l.renew; })[0];
    var a = applyLoan(prior, c.d.payoff, date, true, true), at = allocTotals(a);
    gl.push(['1-12100', 0, at.prin], ['4-41100', 0, at.int], ['4-41300', 0, at.pen]);
    prior.status = 'Renewed'; prior.closedOn = date;
    D.items.forEach(function(it){ if (it.ref === prior.id && !it.stopped) { it.stop = per(date); it.stopped = true; } });
    lines.push({kind: 'loan', ref: prior.id, amt: c.d.payoff, alloc: a});
  }
  if (c.d.adv) gl.push(['4-41100', 0, c.d.adv]);
  l.sched = c.rows; l.A = c.A; l.rate = c.rule.params.rate; l.method = c.rule.params.method; l.ver = c.rule.id;
  l.release = date; l.maturity = c.rows[c.rows.length - 1].due; l.status = 'Active'; l.grace = c.rule.params.grace; l.penPaid = 0;
  l.calc = {fee: c.d.fee, ins: c.d.ins, dst: c.d.dst, cbu: c.d.cbu, payoff: c.d.payoff, net: c.net, A: c.A};
  var tx = book(D, {date: date, type: 'Loan release', channel: channel, mid: l.mid, lines: lines, gl: gl, by: by, memo: 'Release ' + l.no + ' (' + l.prod + ')', ref: l.id, total: l.P});
  if (c.d.cbu > 0){ var ca = D.accts.filter(function(q){ return q.mid === l.mid && q.prod === 'CBU'; })[0]; moveAcct(ca, date, c.d.cbu, tx.id); }
  var m = D.members.filter(function(x){ return x.id === l.mid; })[0];
  if (m && m.office){ D.items.push({id: 'I' + (++D.seq.item), mid: l.mid, office: m.office, code: 'LN-' + l.prod, ref: l.id, amt: l.A, start: perAdd(per(date), 1), stop: per(l.maturity)}); }
  return tx;
}

/* ---------- payroll deduction ---------- */
function itemActive(it, p){ return it.start <= p && (!it.stop || it.stop >= p) && !it.deferred; }
function memberItems(D, mid, p){ return D.items.filter(function(it){ return it.mid === mid && itemActive(it, p); }); }
function coopDeductions(D, mid, p){ return sum(memberItems(D, mid, p), function(it){ return it.amt; }); }
var ORDER = ['LN-RL','LN-EL','LN-CL','CBU','SAV'];
function codeRank(c){ var i = ORDER.indexOf(c); return i < 0 ? 99 : i; }

function buildBatch(D, oc, p, by){
  var o = D.offices.filter(function(x){ return x.code === oc; })[0];
  var members = D.members.filter(function(m){ return m.office === oc && ['Active','Inactive','Suspended'].indexOf(m.status) >= 0; });
  var lines = [], thp = [];
  members.forEach(function(m){
    var its = D.items.filter(function(it){ return it.mid === m.id && it.office === oc && it.start <= p && (!it.stop || it.stop >= p); });
    if (!its.length) return;
    var byCode = {};
    its.forEach(function(it){ (byCode[it.code] = byCode[it.code] || []).push(it); });
    var tot = sum(its, function(it){ return it.amt; });
    if (m.netPay - tot < D.cfg.nthp) thp.push({mid: m.id, net: m.netPay, total: tot, after: r2(m.netPay - tot), choice: null});
    if (o.format === 'TOTAL'){
      lines.push({mid: m.id, emp: m.emp, code: 'TOTAL', amt: tot, items: its.map(function(x){ return x.id; })});
    } else {
      Object.keys(byCode).sort(function(a, b){ return codeRank(a) - codeRank(b); }).forEach(function(c){
        lines.push({mid: m.id, emp: m.emp, code: c, amt: sum(byCode[c], function(x){ return x.amt; }), items: byCode[c].map(function(x){ return x.id; })});
      });
    }
  });
  var prev = D.prevBatch[oc] || {}, changes = [];
  var now = {}; lines.forEach(function(l){ var codes = l.code === 'TOTAL' ? l.items.map(function(id){ return D.items.filter(function(i){ return i.id === id; })[0]; }) : null;
    if (codes) codes.forEach(function(it){ now[l.mid] = now[l.mid] || {}; now[l.mid][it.code] = r2((now[l.mid][it.code] || 0) + it.amt); });
    else { now[l.mid] = now[l.mid] || {}; now[l.mid][l.code] = r2((now[l.mid][l.code] || 0) + l.amt); } });
  Object.keys(now).forEach(function(mid){ Object.keys(now[mid]).forEach(function(c){ var a = now[mid][c], b = (prev[mid] || {})[c];
    if (b == null) changes.push({mid: mid, code: c, type: 'New', prev: 0, now: a}); else if (r2(a - b) !== 0) changes.push({mid: mid, code: c, type: 'Amended', prev: b, now: a}); }); });
  Object.keys(prev).forEach(function(mid){ Object.keys(prev[mid]).forEach(function(c){ if (!now[mid] || now[mid][c] == null) changes.push({mid: mid, code: c, type: 'Stopped', prev: prev[mid][c], now: 0}); }); });
  var b = {id: 'DB-' + p + '-' + oc, office: oc, period: p, status: 'For review', lines: lines, changes: changes, thp: thp, rem: [], builtBy: by, builtOn: D.biz, total: sum(lines, function(l){ return l.amt; }), itemTotal: 0};
  b.itemTotal = sum(D.items.filter(function(it){ return it.office === oc && it.start <= p && (!it.stop || it.stop >= p) && members.some(function(m){ return m.id === it.mid; }); }), function(it){ return it.amt; });
  D.batches = D.batches.filter(function(x){ return x.id !== b.id; }); D.batches.push(b);
  return b;
}
function batchFor(D, oc, p){ return D.batches.filter(function(b){ return b.office === oc && b.period === p; })[0]; }

function simulateRemittance(D, b){
  var o = D.offices.filter(function(x){ return x.code === b.office; })[0], rem = [], ln = 0;
  var sc = D.scen && D.scen.rem && D.scen.rem[b.office] || {};
  b.lines.forEach(function(l){
    var m = D.members.filter(function(x){ return x.id === l.mid; })[0];
    if (sc.zero && sc.zero.indexOf(l.mid) >= 0) return;
    var amt = l.amt, code = l.code, emp = l.emp;
    if (sc.partial && sc.partial.indexOf(l.mid) >= 0 && (l.code.indexOf('LN-') === 0 || l.code === 'TOTAL')) amt = r2(Math.round(l.amt * 0.6));
    if (sc.badcode && sc.badcode.mid === l.mid && sc.badcode.code === l.code) code = '9Z';
    if (sc.noemp && sc.noemp === l.mid) emp = '';
    rem.push({ln: ++ln, emp: emp, name: m.last + ', ' + m.first, birth: m.birth, code: code, amt: amt});
  });
  if (sc.excess){ var mx = D.members.filter(function(x){ return x.id === sc.excess; })[0]; rem.push({ln: ++ln, emp: mx.emp, name: mx.last + ', ' + mx.first, birth: mx.birth, code: 'SAV', amt: 500}); }
  b.rem = rem.map(function(r){ r.status = 'Unmatched'; r.mid = null; r.exp = null; return r; });
  b.remTotal = sum(rem, function(r){ return r.amt; });
  b.fee = r2(b.remTotal * (o.fee || 0));
  b.remOn = D.biz;
  classify(D, b);
  b.status = 'Remittance received';
  // GL: cash in bank (net of agency fee); excess held in suspense until allocated
  var inExp = sum(b.rem.filter(function(r){ return r.status !== 'Excess'; }), function(r){ return r.amt; });
  var exc = r2(b.remTotal - inExp);

  isoProbe: function(){ var D = T(), other = Object.keys(S.tenants).filter(function(k){ return k !== S.t; })[0], O = S.tenants[other];

/* presenter fast-forward to close-ready: posts real entries with role-appropriate users */
function fastForward(D){
  var keep = S.as[S.t], U2 = function(role){ return D.users.filter(function(u){ return u.role === role; })[0].id; };
  var p = WP(D);
  D.offices.forEach(function(o){

    if (b.status === 'Approved'){ b.status = 'Sent'; }
    if (b.status === 'Sent'){ S.as[S.t] = U2('coll'); ACT.bRemit(b.id); }
    if (b.status === 'Remittance received'){ S.as[S.t] = U2('coll'); b.rem.forEach(function(r, i){ if (r.status === 'Suggested'){ r.confirmed = true; } if (r.status === 'Exception'){ var z = b.lines.filter(function(l){ return l.mid === r.mid && b.zero.indexOf(l.idx) >= 0; })[0]; r.code = z ? z.code : 'SAV'; } }); if (!classify(D, b)) b.status = 'Matched'; }
    if (b.status === 'Matched'){ S.as[S.t] = U2('acct'); ACT.bPost(b.id); }
    if (b.status === 'Posted'){ D.unrem.forEach(function(u){ if (u.office === o.code && u.period === p && u.status === 'Open') u.status = 'Billed to member'; }); b.status = 'Closed'; }
  });
  if (!D.intRuns.some(function(r){ return r.period === p && r.status === 'Posted'; })){ S.as[S.t] = U2('acct'); ACT.intSubmit(p); var r = D.intRuns.filter(function(x){ return x.period === p; })[0]; r.status = 'Approved'; r.approvedBy = U2('gm'); ACT.intPost(p); }
  if (D.dayLock < lastWeekday(p) && per(D.biz) === p){
    var s = sessToday(D);
    if (s && s.status === 'Open'){ var c = sessCash(D, s); s.countTotal = c.exp; s.overShort = 0; s.status = 'Counted'; s.countedAt = Date.now(); }
    if (s && s.status === 'Counted'){ S.as[S.t] = U2('gm'); ACT.tEod(s.id); }
    S.as[S.t] = U2('gm'); ACT.dayLock();
  }
  S.as[S.t] = keep;
}

document.addEventListener('click', function(e){
